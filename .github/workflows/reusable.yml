name: Reusable Deploy
on: 
    workflow_call:
        inputs:
            artifact-name:
                required: true
                type: string 
                description: Name of the artifact to download
                default: dist
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get build artifacts 
              uses: actions/download-artifact@v3 
              with: 
                name: ${{ inputs.artifact-name }}
            - name: list files 
              run: ls -la
            - name: Output Information 
              run: echo "HEY HI"
    